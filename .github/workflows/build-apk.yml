name: Build APK

# 只要 push 到 main，或者在 Actions 页面手动点 "Run workflow"，就会编译一个可安装的 debug APK。
on:
  workflow_dispatch:
  push:
    branches: [ main ]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # app/build.gradle 用 git rev-list 统计提交数当 versionCode，必须是完整历史
          fetch-depth: 0

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Make gradlew executable
        run: chmod +x gradlew

      - name: Unit test (Sec-MS-GEC v2)
        run: ./gradlew testAppDebugUnitTest --tests "io.legado.app.SecMsGecTest" --stacktrace

      - name: Build debug APK
        run: ./gradlew assembleAppDebug --stacktrace

      - name: Show APK
        run: ls -lh app/build/outputs/apk/app/debug/

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: legado-edge-fixed-debug
          path: app/build/outputs/apk/app/debug/*.apk
          if-no-files-found: error
